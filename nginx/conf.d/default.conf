# ---------- Log dang JSON (de truy van bang LogQL) ----------
log_format json_combined escape=json
  '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
  '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
  '"request_time":$request_time,"referer":"$http_referer","ua":"$http_user_agent"}';
error_log  /dev/stderr warn;

server_tokens off;
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;

upstream chungcu_app { server app:3000; keepalive 16; }

# HTTP -> HTTPS
server {
  listen 8080;
  server_name _;
  access_log /dev/stdout json_combined;
  return 301 https://$host$request_uri;
}

# HTTPS (chung chi tu ky)
server {
  listen 8443 ssl;
  http2 on;
  server_name _;
  access_log /dev/stdout json_combined;

  ssl_certificate     /etc/nginx/certs/server.crt;
  ssl_certificate_key /etc/nginx/certs/server.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:5m;
  ssl_session_timeout 1h;

  # ---- Security headers ----
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; frame-ancestors 'none'; form-action 'self'; base-uri 'self'" always;

  client_max_body_size 1m;
  limit_req zone=general burst=60 nodelay;

  # Khong lo /metrics ra ngoai (Prometheus scrape truc tiep trong mang noi bo)
  location = /metrics { return 404; }

  location = /login {
    limit_req zone=login burst=5 nodelay;
    proxy_pass http://chungcu_app;
    include /etc/nginx/proxy_params.conf;
  }

  location / {
    proxy_pass http://chungcu_app;
    include /etc/nginx/proxy_params.conf;
  }
}

# stub_status cho nginx-exporter - chi lang nghe trong mang noi bo, KHONG publish ra host
server {
  listen 8081;
  location = /stub_status { stub_status; access_log off; }
  location / { return 404; }
}
