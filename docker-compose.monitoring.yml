
x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true

services:
  prometheus:
    <<: *hardening
    image: prom/prometheus:v2.54.1
    container_name: cc_prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring
      - port_access

  grafana:
    <<: *hardening
    image: grafana/grafana:11.2.0
    container_name: cc_grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SMTP_ENABLED: ${GRAFANA_SMTP_ENABLED:-false}
      GF_SMTP_HOST: ${GRAFANA_SMTP_HOST}
      GF_SMTP_USER: ${GRAFANA_SMTP_USER}
      GF_SMTP_PASSWORD: ${GRAFANA_SMTP_PASSWORD}
      GF_SMTP_FROM_ADDRESS: ${GRAFANA_SMTP_FROM_ADDRESS}
      GF_SMTP_FROM_NAME: ${GRAFANA_SMTP_FROM_NAME:-Chung cu Monitoring}
      GF_SMTP_STARTTLS_POLICY: ${GRAFANA_SMTP_STARTTLS_POLICY:-MandatoryStartTLS}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring
      - port_access

  cadvisor:
    <<: *hardening
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cc_cadvisor
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - monitoring

  node-exporter:
    <<: *hardening
    image: prom/node-exporter:v1.8.2
    container_name: cc_node_exporter
    command:
      - --path.rootfs=/host
      - '--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|run/.+|mnt/host/.+|parent-distro/.+|tmp/.+)($|/)'
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks:
      - monitoring
    cap_drop:
      - ALL

  postgres-exporter:
    <<: *hardening
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: cc_pg_exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://chungcu_exporter:${EXPORTER_DB_PASSWORD}@db:5432/chungcu?sslmode=disable"
    networks:
      - monitoring

  nginx-exporter:
    <<: *hardening
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: cc_nginx_exporter
    command:
      - --nginx.scrape-uri=http://nginx:8080/stub_status
    networks:
      - monitoring

volumes:
  prometheus_data:
  grafana_data:

networks:
  monitoring:
    name: chungcu_monitoring
    external: true
  port_access:
    name: cc_monitoring_test_net
    external: true