# Log tap trung: Promtail (thu thap log Docker) -> Loki (luu tru) -> Grafana (truy van LogQL)
x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true

services:
  loki:
    <<: *hardening
    image: grafana/loki:3.2.0
    container_name: cc_loki
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    networks: [monitoring]         # khong publish cong; chi Grafana/Promtail truy cap noi bo
    cap_drop: [ALL]


  alloy:
    image: grafana/alloy:latest
    container_name: cc_alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - loki
    networks:
      - monitoring
    security_opt:
      - no-new-privileges:true

  grafana:                          # bo sung phu thuoc: Grafana cho Loki khoi dong truoc
    depends_on: [loki]

volumes:
  loki_data:
  alloy_data: